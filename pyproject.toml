[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-response-memoizer"
version = "0.1.0"
description = "Caches deterministic LLM subqueries using normalized intent signatures, Jaccard similarity, and TTL expiry"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
semantic-response-memoizer = "semantic_response_memoizer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["semantic_response_memoizer*"]
